# 每次提交都跑两道门 —— **这是这个仓库唯一的自动门。**
#
# ## 为什么需要它
#
# 推送走的是 `by1run --push`，而它用 `git push --no-verify`：**本地钩子不跑。**
# 所以在我这台机器上，"检查过了"和"提交了"之间没有强制关系。
#
# 而真正堵住推送的那些错 —— 语法错、`FILES.md` 过期、行尾变成 CRLF、
# `by1files` 的生成顺序 —— **全都落在档 1 里**。
#
# **它已经抓到过一次**（2026-10-16）：`FILES.md` 是用"带某个覆写条目的
# `by1files.py`"生成的，而那个改动漏在提交外 —— 于是**每一次推送都是红的**，
# 直到按 CI 的条件（干净 clone + 零依赖）复现出来。这就是这条门存在的意义。
#
# ## 两道门各管什么
#
#   **档 1（纯标准库，什么都不装）** —— 它同时是"档 1 只要标准库"这句话的证明。
#       装了依赖再跑，就证明不了它。
#   **档 3（只装 numpy）** —— 档是累积的，所以这条腿跑的是 1 + 2 + 3：
#       26 份 .by1 检查器 · 模式分类 · lint 十类静默写法 · **变异反例库**
#       （每条规则一个必红反例）· 取值门 · by1sample 采样链 ·
#       refs 的 config 逐字段与张量名/形状。
#
# ## 不跑什么（**不假装覆盖**）
#
#   档 4（完整模型）要 torch + transformers，档 5（真权重前向）还要权重下载。
#   那两条腿**不在 CI 里** —— 它们的证据在 docs/ 的报告与本机的门禁里。
#
# ## 为什么 Windows 也跑
#
# 这个项目在 Windows 上开发，而**行尾**和路径分隔符在这里出过两次事
# （66 个文件的工作副本是 CRLF 而 `.gitattributes` 写的是 LF）。
# 只在 Linux 上跑就看不见那类问题。
#
# ## 为什么 3.9 也在矩阵里
#
# `pyproject.toml` 写着 `requires-python = ">=3.9"` —— 而那个下限
# **从来没有被真跑过一次**（这句原来就写在这儿，仍然成立）。3.9 是来验那句话的。
# 实测（2026-10-16）：3.9 上 pip 解析到 numpy 2.0.2，档 3 同样 101 项 0 失败。

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tier1:
    name: 档 1（静态 · 纯标准库）
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个组合红了，别把别的组合取消掉 —— 那样只看得到第一个错。
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # `pyproject.toml` 写着 `requires-python = ">=3.9"` ——
        # 而那个下限**从来没有被真跑过一次**。3.9 是来验那句话的。
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 确认没有装任何东西
        run: python -c "import sys; print(sys.version); print(len(sys.path))"

      - name: 档 1
        run: python src/checks/by1all.py --tier 1

      # **判定行里写着「[全过（N 项没验）]」—— 那 N 项不是绿的。**
      # 档 1 会跳过档 2 以后的内容，那是"这一档没验"，不是失败。
      # 所以这里看的是**退出码**：非零就是真红。
      #
      # 退出码的含义是五态的，不是两态的：
      #   0 过 · 1 被测的东西错了 · 30 这台机器上没验 · 40 调用方错了 · 51 检查器坏了
      # 档 1 全静态，正常情况只会是 0 或 1。

  tier3:
    name: 档 3（结构 + 判据 + refs 契约 · 只要 numpy）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # **只装 numpy** —— 档 3 是累积的（1 + 2 + 3），它要的东西到此为止。
      # 不装 torch / transformers：档 4（完整模型）与档 5（真权重前向）
      # **不在 CI 里**，这条不假装覆盖它们。
      #
      # 实测（2026-10-16，本地）：干净 clone + 只有 numpy 时
      #   3.12 → numpy 2.5.4 · 101 项 0 失败
      #   3.9  → numpy 2.0.2（3.9 能装到的最后一支 2.x）· 101 项 0 失败
      - name: 装 numpy
        run: python -m pip install numpy

      - name: 档 3
        run: python src/checks/by1all.py --tier 3

      # 这一条会跑：编译/import/解析（档 1）· 26 份 .by1 检查器 · 模式分类 ·
      # lint 十类静默写法 · **变异反例库**（每条规则一个必红反例）·
      # 取值门 · by1sample 采样链 · refs 的 config 逐字段与张量名/形状。
      #
      # 它是"改规则必须配反例"这条纪律在 CI 里的执行者：
      # 一条新规则没有反例，档 2 的 by1mutate 不会红 —— 但**规则本身跑错**
      # 会在档 3 的 refs 契约里红出来。

