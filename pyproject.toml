[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "by1"
# **版本从 by1ver.py 读，不在这里写死。**
# 写死的话就是这个项目里反复出现的那一类：
# 同一个意思在两个地方，而没有任何东西保证它们一致。
dynamic = ["version"]
description = "描述大模型架构的语言 —— 接口是一份规范化 IR 规格"
readme = "README.md"
requires-python = ">=3.9"
# SPDX 表达式，一处。**不另加 license classifier** ——
# 那是同一个意思写两遍，而这个仓库的约定是"同一个意思不要两处实现"。
# 第三方元数据（`refs/`）不在这个许可证覆盖范围内，见 `NOTICE`。
license = "GPL-3.0-or-later"
keywords = ["llm", "architecture", "ir", "codegen", "ggml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# **依赖只在判卷人那边需要。** 核心（IR、检查器、C 后端）
# 只用标准库 —— 想读规格、写第四个后端的人不用装 torch。
dependencies = []

[project.optional-dependencies]
# 对拍用的。判卷人要跟外部实现比，所以这一坨是必需的。
#
# **`fla-core` 不在里面**，虽然 `by1kda.py` 要它当参照物 —— 因为它带着
# triton 那一串（GPU 才用得上），在 CPU 机器上 `pip install -e '.[verify]'`
# 会被它拖垮。**照 by1kda 的提示单独装**：
#     pip install --no-deps fla-core einops
# 装不上的时候 by1kda 会**干净跳过**（`by1skip`），不是崩 ——
# 这一条是撞出来的：原来它少一个 `return`，报出来是 AttributeError。
verify = ["numpy", "torch", "transformers", "safetensors", "einops"]
# 编译 C 后端用的（Windows 上也可以走 mingw）
#
# **这里以前是空的 `c = []`**，而 `by1c.py` / `by1exec.py` 在**模块级**
# `import numpy` —— 于是"跑 C 后端只用标准库"这句话对不上：
# `pip install -e '.[c]'` 什么都不会装。numpy 是那两个后端的运行时依赖。
c = ["numpy"]
run = ["numpy"]
train = ["torch"]
full = ["torch", "transformers>=5.19,<6", "safetensors"]

[project.scripts]
# **单包（`src/by1/`，迁移计划见 docs/TEMP-rename-plan.md）。**
# 入口点写完整模块路径：`by1.lang.cli` / `by1.ir` / `by1.checks.all` …
by1 = "by1.lang.cli:main"
"by1-spec" = "by1.ir:_cli"
"by1-all" = "by1.checks.all:main"
"by1-verify" = "by1.checks.verify:main"
"by1-check" = "by1.check:main"
"by1-boot" = "by1.boot:main"
"by1-e2e" = "by1.checks.e2e:main"

[tool.setuptools]
# **单包：`src/by1/`。** 迁移之后不再有 py-modules —— 所有模块住在这个包
# 和它的五个子包里（`by1.checks` `by1.lang` `by1.modelcheck` `by1.data`
# `by1.escape`）。
#
# `models/` `refs/` 不是包数据 —— 分发那一包走 `by1pack`，不经过 pip。
package-dir = {"" = "src"}
py-modules = []

# **子目录是包。** `py-modules` 只在包根（`src/`）找模块，而拆分之后
# 41 个模块不在那儿了 —— 于是 `pip install -e .` 装不全，而上面那份
# 清单还在说 53 个。**两句话里有一句是假的。**
#
# 装完和没装跑的是同一套逻辑：`by1paths._bootstrap()` 把 `SRC` 和每个
# 子目录放上 sys.path，两种情况算出来的都是"这些目录"。
#
# 只装 `by1` 一个顶层包（含五个子包）。上一版用的是通用名
# `lang` / `checks` / `data` / `modelcheck` / `escape` —— 装进 site-packages
# 会和别人的同名包撞；单包之后这个粗糙处没了。
packages = ["by1", "by1.checks", "by1.lang", "by1.modelcheck",
            "by1.data", "by1.escape"]

[tool.setuptools.dynamic]
# **从文件读，不从模块读。**
# `attr = "by1ver.TOOL_VERSION"` 会让 setuptools 去导入 ——
# 而它一旦开始导入就会摸到别的模块，其中几个在模块级 import
# transformers（判卷人必需的）。**打包不该需要跑得动 torch。**
# VERSION 是 `python src/by1ver.py --write` 生成的，真相源仍是 TOOL_VERSION。
version = { file = "VERSION" }

[tool.setuptools.package-data]
# ⚠️ **这一段是空的，而且改不成有用的。**
#
# 它原来写的是 `"*" = ["*.c"]`，注释说"ext-demo.c 跟着代码走" ——
# 而实测（`pip wheel` 之后看 wheel 里的 payload）：**一个 .c 都没有**。
# 原因：`package-data` 只挂在 **package** 上，而这个项目
# **一个 package 都没有**（只有 `py-modules`），所以 `"*"` 谁都不匹配。
# 留着它是为了让"这里出现过 *.c"不再被读成"这件事已经处理过了"。
#
# 真正把它装进去的是下面的 `data-files`。
"*" = []

[tool.setuptools.data-files]
# **`ext-demo.c` 是 `by1extdemo.py` 的输入** —— 装完不能没有它。
# 空键 = 安装前缀那一级（实测 `pip install` 之后落在 venv 根）。
# 这是 `py-modules` 项目里唯一能让非 .py 文件进 wheel 的办法；
# `by1extdemo._find_src()` 会把这几个布局都找一遍。
"" = ["src/escape/ext-demo.c"]
