[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "by1"
# **版本从 by1ver.py 读，不在这里写死。**
# 写死的话就是这个项目里反复出现的那一类：
# 同一个意思在两个地方，而没有任何东西保证它们一致。
dynamic = ["version"]
description = "描述大模型架构的语言 —— 接口是一份规范化 IR 规格"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["llm", "architecture", "ir", "codegen", "ggml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# **依赖只在判卷人那边需要。** 核心（IR、检查器、C 后端）
# 只用标准库 —— 想读规格、写第四个后端的人不用装 torch。
dependencies = []

[project.optional-dependencies]
# 对拍用的。判卷人要跟外部实现比，所以这一坨是必需的。
verify = ["numpy", "torch", "transformers", "safetensors"]
# 编译 C 后端用的（Windows 上也可以走 mingw）
#
# **这里以前是空的 `c = []`**，而 `by1c.py` / `by1exec.py` 在**模块级**
# `import numpy` —— 于是"跑 C 后端只用标准库"这句话对不上：
# `pip install -e '.[c]'` 什么都不会装。numpy 是那两个后端的运行时依赖。
c = ["numpy"]

[project.scripts]
by1 = "by1ver:main"
"by1-spec" = "by1ir:_cli"
"by1-all" = "by1all:main"
"by1-verify" = "by1verify:main"
"by1-check" = "by1check:main"
"by1-boot" = "by1boot:main"
"by1-e2e" = "by1e2e:main"

[tool.setuptools]
# **代码摊在 `src/` 下 —— 它仍然不是一个"包"**，是一堆能单独跑的小工具
# 加一份规格。所以还是 py-modules，只是告诉 setuptools 它们在 src/。
#
# `models/` `refs/` 不是包数据 —— 分发那一包走 `by1pack.py`，不经过 pip。
package-dir = {"" = "src"}
py-modules = [
    "by1", "by1all", "by1blind", "by1boot",
    "by1bootir", "by1c", "by1check", "by1cloud",
    "by1cmp", "by1codegen", "by1contract", "by1debt",
    "by1dev", "by1diff", "by1docs", "by1e2e",
    "by1emit", "by1exec", "by1ext", "by1extdemo",
    "by1fetch", "by1gate", "by1gpt2", "by1gpu",
    "by1index", "by1instella", "by1io", "by1ir",
    "by1irentry", "by1lint", "by1load", "by1mem",
    "by1mla", "by1moe", "by1name", "by1opdiff",
    "by1oracle", "by1oracles", "by1pack", "by1pat",
    "by1paths", "by1raw", "by1real", "by1rebuild",
    "by1refs", "by1rope", "by1skip", "by1smoke",
    "by1train", "by1triage", "by1ver", "by1verify",
    "by1vocab",
]

[tool.setuptools.dynamic]
# **从文件读，不从模块读。**
# `attr = "by1ver.TOOL_VERSION"` 会让 setuptools 去导入 ——
# 而它一旦开始导入就会摸到别的模块，其中几个在模块级 import
# transformers（判卷人必需的）。**打包不该需要跑得动 torch。**
# VERSION 是 `python src/by1ver.py --write` 生成的，真相源仍是 TOOL_VERSION。
version = { file = "VERSION" }

[tool.setuptools.package-data]
# ⚠️ **这一段是空的，而且改不成有用的。**
#
# 它原来写的是 `"*" = ["*.c"]`，注释说"ext-demo.c 跟着代码走" ——
# 而实测（`pip wheel` 之后看 wheel 里的 payload）：**一个 .c 都没有**。
# 原因：`package-data` 只挂在 **package** 上，而这个项目
# **一个 package 都没有**（只有 `py-modules`），所以 `"*"` 谁都不匹配。
# 留着它是为了让"这里出现过 *.c"不再被读成"这件事已经处理过了"。
#
# 真正把它装进去的是下面的 `data-files`。
"*" = []

[tool.setuptools.data-files]
# **`ext-demo.c` 是 `by1extdemo.py` 的输入** —— 装完不能没有它。
# 空键 = 安装前缀那一级（实测 `pip install` 之后落在 venv 根）。
# 这是 `py-modules` 项目里唯一能让非 .py 文件进 wheel 的办法；
# `by1extdemo._find_src()` 会把这几个布局都找一遍。
"" = ["src/ext-demo.c"]
